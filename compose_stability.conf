// Types the Compose compiler cannot see are immutable, declared stable here.
//
// The compiler infers stability only for classes it compiles itself. The
// read-only collections come from the Kotlin stdlib and the models from
// :shared, which has no Compose compiler, so every parameter of these types
// counted as unstable. Under strong skipping an unstable argument is compared
// by identity, so a list filtered again or a `Song.copy(...)` with the same
// fields always looked new and re-ran the row it was handed to.
//
// Listing a type here is a promise that nobody mutates an instance after it is
// handed to the UI. The read-only collection interfaces are only ever backed by
// lists and maps that are built once and replaced, never written to, by the
// view models and stores that hand them out; the models are data classes of
// `val`s, enums and sealed hierarchies of the same.

kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection

com.music.bitchord.data.model.*
