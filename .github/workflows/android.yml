name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft_tag:
        description: "Tag for a private draft release. Empty means an artifact-only build."
        required: false
        default: ""

# A draft release needs the contents scope; the artifact build does not.
permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        # The same key every public Auris release was signed with, so a build
        # from here installs over the one already on the phone instead of
        # failing with a package conflict. The dev flavour is Auris's package
        # (com.dev.bitchord); the prod flavour is the upstream app's.
        echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > bitchord-fork.jks
        {
          echo "storeFile=bitchord-fork.jks"
          echo "storePassword=android"
          echo "keyAlias=forkdebug"
          echo "keyPassword=android"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Dev Release APK
      run: ./gradlew :app:assembleDevRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: auris-dev-release-signed
        path: app/build/outputs/apk/dev/release/*.apk

    # A draft release: visible only to this repository's collaborators, not
    # published, no announcement. Asked for by name so the ordinary artifact
    # build stays exactly what it was.
    - name: Draft the release
      if: inputs.draft_tag != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.draft_tag }}
        name: Auris ${{ inputs.draft_tag }} — private draft
        draft: true
        prerelease: true
        files: app/build/outputs/apk/dev/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
