name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-auris-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      run: |
        set -euo pipefail
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        # Auris uses the fork's stable key so releases install over the app
        # already on the phone. Validate it before Gradle so a missing or
        # malformed secret fails here instead of during APK packaging.
        if [ -z "$KEYSTORE_B64" ]; then
          echo "ANDROID_KEYSTORE_B64 is missing or empty" >&2
          exit 1
        fi
        printf '%s' "$KEYSTORE_B64" | base64 --decode > bitchord-fork.jks
        test -s bitchord-fork.jks
        keytool -list \
          -keystore bitchord-fork.jks \
          -storepass android \
          -alias forkdebug
        keytool -certreq \
          -keystore bitchord-fork.jks \
          -storepass android \
          -keypass android \
          -alias forkdebug \
          -file "$RUNNER_TEMP/fork-certreq.pem"
        actual_fingerprint=$(
          keytool -list -v \
            -keystore bitchord-fork.jks \
            -storepass android \
            -alias forkdebug |
          sed -n 's/^[[:space:]]*SHA256: //p' |
          tr -d ':' |
          tr '[:upper:]' '[:lower:]'
        )
        # Public SHA-256 certificate fingerprint from Auris v3.1. A different
        # key would sign APKs that cannot update the installed app.
        expected_fingerprint="385af3b4b3f5b4357b7bb271fd71b267fad4d536be87e44f2057b0c2de8971ce"
        if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
          echo "Unexpected signing certificate: $actual_fingerprint" >&2
          exit 1
        fi
        {
          echo "storeFile=bitchord-fork.jks"
          echo "storePassword=android"
          echo "keyAlias=forkdebug"
          echo "keyPassword=android"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Auris Release APK
      run: ./gradlew :app:assembleDevRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: auris-dev-release-signed
        path: app/build/outputs/apk/dev/release/*.apk
