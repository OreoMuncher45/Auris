name: Flow Debug APK

on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Unit tests (Flow + queue)
        run: ./gradlew :app:testDevDebugUnitTest --tests "com.music.bitchord.FlowTest" --tests "com.music.bitchord.QueueBuilderTest"

      - name: Build debug APK
        run: ./gradlew :app:assembleDevDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-flow-debug
          path: app/build/outputs/apk/dev/debug/*.apk
