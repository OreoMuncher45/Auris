name: Flow Debug APK

on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Configure IMA name, Spotify package ID, and voice intents
        run: |
          python3 - <<'PY'
          import pathlib, re
          import xml.etree.ElementTree as ET

          root = pathlib.Path("app")
          changed = []

          # 1. Rename app_name to IMA in all strings.xml files
          for xml in root.rglob("strings.xml"):
              text = xml.read_text(encoding="utf-8")
              updated = re.sub(
                  r'(<string\b[^>]*\bname="app_name"[^>]*>)([^<]*)(</string>)',
                  r'\1IMA\3',
                  text,
              )
              if updated != text:
                  xml.write_text(updated, encoding="utf-8")
                  changed.append(str(xml))

          # 2. Set applicationId to com.spotify.music, strip suffixes, and set app_name to IMA in Gradle
          for gradle in [root / "build.gradle.kts", root / "build.gradle"]:
              if not gradle.exists():
                  continue
              text = gradle.read_text(encoding="utf-8")
              updated = text

              # Set applicationId = "com.spotify.music" (keep namespace untouched!)
              updated = re.sub(
                  r'(applicationId\s*=\s*)"[^"]*"',
                  r'\1"com.spotify.music"',
                  updated,
              )
              updated = re.sub(
                  r'(applicationId\s+)"[^"]*"',
                  r'\1"com.spotify.music"',
                  updated,
              )

              # Remove applicationIdSuffix so the APK package is strictly com.spotify.music
              updated = re.sub(
                  r'^[^\n]*applicationIdSuffix[^\n]*\n?',
                  '',
                  updated,
                  flags=re.MULTILINE,
              )

              # Set app_name resValue / manifestPlaceholders to IMA
              updated = re.sub(
                  r'resValue\(\s*"string"\s*,\s*"app_name"\s*,\s*"[^"]*"\s*\)',
                  'resValue("string", "app_name", "IMA")',
                  updated,
              )
              updated = re.sub(
                  r'resValue\s+"string"\s*,\s*"app_name"\s*,\s*"[^"]*"',
                  'resValue "string", "app_name", "IMA"',
                  updated,
              )
              updated = re.sub(
                  r'(manifestPlaceholders\["appName"\]\s*=\s*)"[^"]*"',
                  r'\1"IMA"',
                  updated,
              )
              updated = updated.replace('"BitChord Next"', '"IMA"')
              updated = updated.replace('"Auris Dev"', '"IMA"')

              if updated != text:
                  gradle.write_text(updated, encoding="utf-8")
                  changed.append(str(gradle))

          # 3. Update AndroidManifest.xml with voice search + Spotify deep link filters and safe provider authorities
          manifest = root / "src" / "main" / "AndroidManifest.xml"
          if manifest.exists():
              text = manifest.read_text(encoding="utf-8")
              updated = text

              # Avoid FileProvider / ContentProvider authority conflicts with official Auris
              updated = updated.replace(
                  'android:authorities="com.music.bitchord',
                  'android:authorities="${applicationId}',
              )

              # Add MEDIA_PLAY_FROM_SEARCH and Spotify URI filters inside MainActivity if missing
              if "MEDIA_PLAY_FROM_SEARCH" not in updated:
                  extra_filters = """
                      <intent-filter>
                          <action android:name="android.media.action.MEDIA_PLAY_FROM_SEARCH" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="spotify" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="open.spotify.com" />
                      </intent-filter>
                  """
                  # Insert right before the closing </activity> of MainActivity
                  pattern = re.compile(
                      r'(<activity\b[^>]*MainActivity[^>]*>.*?)(</activity>)',
                      re.DOTALL,
                  )
                  if pattern.search(updated):
                      updated = pattern.sub(
                          lambda m: m.group(1) + extra_filters + m.group(2),
                          updated,
                          count=1,
                      )

              if updated != text:
                  # Verify well-formed XML before saving
                  ET.fromstring(updated)
                  manifest.write_text(updated, encoding="utf-8")
                  changed.append(str(manifest))

          print("Patched files:", changed)
          PY

      - run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDevDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ima-spotify-aa-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
