name: Flow Debug APK

on:
  workflow_dispatch:
  push:
    # draft-*, not v*.*.*: the desktop release workflow listens on v*.*.*, and
    # a tag that matches both patterns builds the desktop app as well. The
    # two are disjoint by name now, so a draft tag can never start a desktop
    # build.
    tags: ["draft-*"]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      # Minified release runtime (R8 per app/build.gradle.kts: unoptimized
      # debug Compose runs measurably slower) signed with the fork's stable
      # key so updates keep installing. Still a dev build, not prod.
      - name: Stable fork signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > bitchord-fork.jks
          {
            echo "storeFile=bitchord-fork.jks"
            echo "storePassword=android"
            echo "keyAlias=forkdebug"
            echo "keyPassword=android"
          } > keystore.properties

      # No test step in front of this. The unit-test task compiles the app's
      # test sources and its native variant first, and those six minutes were
      # most of a draft's wall clock — for a gate that only says whether the
      # Flow scoring and the queue builder still agree with themselves.
      #
      # What is still guaranteed: the APK step compiles every module the app
      # is made of, so a build that does not compile never produces an APK.
      # What is no longer guaranteed: a draft can carry a behaviour change
      # that compiles and is wrong. Run :app:testDevDebugUnitTest locally
      # before pushing a change worth testing on a phone.
      - name: Build minified APK
        run: ./gradlew :app:assembleDevRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-next-release
          path: app/build/outputs/apk/dev/release/*.apk
