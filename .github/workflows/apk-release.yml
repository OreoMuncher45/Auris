name: Android APK Draft Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build (default auris-2.3)"
        required: false
        default: "auris-2.3"

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: Build Android APK only (no desktop)
        run: ./gradlew :app:assembleProdRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/prod/release/*.apk dist/ 2>/dev/null || true
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*

      - name: Create private draft release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auris-2.3-draft-${{ github.run_number }}
          name: Auris 2.3 Draft (run ${{ github.run_number }})
          draft: true
          make_latest: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
