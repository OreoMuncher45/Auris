name: Android Draft APK

# The phone build for a private draft. Android only: the desktop builds live
# in release.yml and desktop-windows.yml, and nothing here touches them — a
# draft is a sideloaded APK, signed with the fork's key so it installs over
# the last one without touching the prod app.
#
# Manual dispatch on purpose. A draft is not cut by a tag: the tag and the
# desktop release workflow are tied to published releases, and a private
# preview should not be able to start either by accident.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the APK, verbatim"
        required: true
        default: "3.1"
      version_code:
        description: "versionCode stamped into the APK"
        required: true
        default: "155"
      tag:
        description: "Tag of the private draft release"
        required: true
        default: "v3.1"
      title:
        description: "Title of the private draft release"
        required: true
        default: "Auris 3.1 — private preview"
      notes:
        description: "Release notes for the draft"
        required: false
        default: |
          Auris 3.1 — private preview

          Dolby Atmos
          - A phone with no hardware Dolby decoder no longer gets the spatial
            mix. Dolby's own decoder ships with the maker's Android build, not
            with Android, so plenty of phones have none at all — and E-AC-3 in
            six channels, decoded in software by the copy of FFmpeg inside the
            app, costs whole cores for as long as it plays. That is the one
            thing in the app that burns CPU while the screen is off and nothing
            is happening. The Dolby rung now falls back to the lossless copy,
            which is the rung's own fallback anyway, and the quality badge
            says "Lossless" because that is what is playing. The reason is
            written once to the log, and the performance report now carries a
            line saying which of the three it is: a hardware decoder, a
            software-only one, or none at all.
          - A phone that does have one is untouched: the mix is asked for and
            played as before. The question is asked once, off the main thread,
            and the answer is kept.

          Performance
          - Live blur stays ON by default and now tracks the picture properly:
            the colour behind the player is read every 33ms (thirty times a
            second), and the backdrop's mesh is redrawn on every one of those
            frames instead of ten times a second. The colour is only published
            when it has actually moved far enough to see, so the text and the
            buttons are not redrawn thirty times a second for a wash nobody
            could see changing.
          - The player's ink no longer fights itself: a frame no longer
            cancels the colour read already in flight, so the wash settles
            instead of chasing itself.
          - The frame capture callback now runs on its own thread instead of
            waiting for the main thread, and the capture loop no longer spins
            when there is no picture to copy. That spin was the app's own
            heartbeat, and it is gone.
          - The next track's source search is now single-flight: one search per
            track at a time, and a second request waits for the first answer
            instead of starting another one. The queue changes several times a
            minute, and each change used to start the same patient search
            again — five searches for one track in one minute, each asking
            every source and waiting for all of them. That was the addon
            traffic, the hundred-odd threads and the two hundred percent of
            CPU.
          - The PO-token WebView — the browser page the app loads to prove it
            is not a bot — is released after three minutes of doing nothing.
            A browser inside the app costs tens of megabytes and a few dozen
            threads.
          - The performance monitor now reports the system CPU and this app's
            share of it, and counts the three things that cost the most:
            source searches (RESOLVE), next-track preparations (PREPARE) and
            WebView starts (WEBVIEW). "Copy log" now includes the whole
            performance report, so a copied log answers the CPU questions
            without another run.
          - The Automix's memory is now bounded. Each track it measures leaves
            behind a quarter of a megabyte of numbers — three envelope curves
            and a waveform of up to four thousand points — and they were kept
            for ever. The waveform is now dropped from every track but the few
            the panel is drawing, and the oldest results are let go of once
            there are more than two dozen. Nothing the mixer reads is lost: the
            tempo, the beat grid and the mix points stay, and a track that
            comes round again is read back from the app's own store rather
            than measured a second time.

          Player
          - The title and the artist sit lower, under the artwork, and the
            whole control deck sits a little lower with them.
          - With the full-screen album art turned off, the album art is bigger
            and lower. The card now reaches past the player's own margins — the
            controls keep them, the artwork does not — and ends up sixteen dp
            from the screen's edge instead of thirty. It is also pushed down
            into the gap it used to leave above the title, and the title and
            the artist stay exactly where they were: the card's growth and its
            new lower position are paid for out of the gap between the card
            and the title, not out of the title's own place.
          - The line of lyrics, the scrubber, the timestamps and the quality
            badge now sit lower again, as one block, and the gap they take
            comes out of the scrubber's own gap to the transport. The
            reference player has no lyric line, so its title is followed by
            the scrubber and nothing else; this one has both, and after the
            credits moved down the lyric line came up with them and sat
            almost against the artist's name. The sleeve, the title, the
            artist, the transport, the volume and the action row stay exactly
            where they were — only that one block moved, and on a screen with
            little to spare it moves by as much as the gap has, down to 6dp.
          - The item strengths were measured against the reference player and
            matched: the seek bar and the volume bar are dimmer and thinner,
            the timestamps are quieter, the quality badge is quieter, and the
            star and the menu beside the title are quieter.
          - The title and the transport wear the player's ink again, like every
            other mark on the screen. They used to wear a second colour — the
            same ink lifted toward white — so that they could be as light as
            the reference player without the ink itself losing the record's
            colour. It read as two colour systems on one screen: a pale title
            over a tinted lyric line, a white transport over a coloured volume
            bar, and the cover's own hue in some marks and not others. One
            ink now, and a mark's strength is how much of it the mark wears.

          Installs over 3.0.43: same package, same signing key.
permissions:
  contents: write

concurrency:
  group: android-draft-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and draft
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Write local.properties
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
          } > local.properties

      # The fork's key, the same one every private draft since 2.3.x was
      # signed with — so a tester installs this over the last one without
      # uninstalling first, and without touching the prod package.
      - name: Fork signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > bitchord-fork.jks
          {
            echo "storeFile=bitchord-fork.jks"
            echo "storePassword=android"
            echo "keyAlias=forkdebug"
            echo "keyPassword=android"
          } > keystore.properties

      # The version is stamped from the input rather than read out of the
      # build file, so the number in the dispatch and the number inside the
      # APK cannot drift apart. The build file is the fallback; both are
      # checked before anything is compiled.
      - name: Stamp the version
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          vc="${{ inputs.version_code }}"
          sed -i -E "s/^(\s*)versionCode = [0-9]+/\1versionCode = $vc/" app/build.gradle.kts
          sed -i -E "s/^(\s*)versionName = \"[^\"]*\"/\1versionName = \"$v\"/" app/build.gradle.kts
          grep -E "versionCode = |versionName = " app/build.gradle.kts | head -4
          grep -q "versionCode = $vc" app/build.gradle.kts
          grep -q "versionName = \"$v\"" app/build.gradle.kts

      # The dev flavour, release build type: R8, no debuggable runtime, signed.
      # The ABI splits give one APK per architecture plus a universal one.
      - name: Build the APKs
        run: ./gradlew :app:assembleDevRelease

      - name: Collect
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/dev/release/*.apk dist/
          ls -lh dist

      # The analyser library's presence is the proof that this build carries
      # the neural path and is not an older APK wearing a newer version name.
      - name: The analyser is in the APK
        run: |
          set -euo pipefail
          for apk in dist/*.apk; do
            echo "== $apk"
            unzip -l "$apk" | grep -E "lib/.*/libbitchord_analysis.so" || {
              echo "no analyser library in $apk" >&2
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-draft-apk
          path: dist/*.apk

      # The package, the version and the signing certificate, checked before
      # anything is published: a tester installs this over the last draft, so
      # the package has to be the same one, the versionCode has to be higher
      # than the installed build's, and the certificate has to be the fork's.
      - name: Check the package, version and signature
        env:
          EXPECTED_FINGERPRINT: "385af3b4b3f5b4357b7bb271fd71b267fad4d536be87e44f2057b0c2de8971ce"
          EXPECTED_PACKAGE: "com.dev.bitchord"
        run: |
          set -euo pipefail
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in dist/*.apk; do
            echo "== $apk"
            badging="$("$bt/aapt2" dump badging "$apk" | grep -E "^package:" | head -1)"
            echo "$badging"
            echo "$badging" | grep -q "package: name='$EXPECTED_PACKAGE'"
            echo "$badging" | grep -q "versionCode='${{ inputs.version_code }}'"
            # The digest line is spelled differently by different build-tools
            # ("Signer #1 certificate SHA-256 digest:" on older ones, "V2
            # Signer: certificate SHA-256 digest:" on newer), so the hex is
            # taken out of whatever line names the SHA-256 rather than by
            # matching a label.
            certs="$("$bt/apksigner" verify --print-certs "$apk")"
            echo "$certs" | grep -i "sha-256" || true
            cert="$(echo "$certs" | grep -i "sha-256" | head -1 | tr -d ':' | grep -oiE "[0-9a-f]{64}" | head -1)"
            echo "signer: $cert"
            if [ -z "$cert" ]; then
              echo "no signer certificate found in $apk" >&2
              exit 1
            fi
            test "$cert" = "$EXPECTED_FINGERPRINT"
          done

      # The draft itself: private, untagged, no publish. GitHub creates the
      # tag only when a draft is published, so nothing is cut here — the
      # draft is a download, not a release.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
            fi
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,assets \
            --jq '{tag: .tagName, name: .name, draft: .isDraft, assets: [.assets[].name]}'
          # A published release would be public; a draft is not. Fail loudly
          # rather than let one slip out.
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
