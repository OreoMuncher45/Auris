name: Android Draft APK

# The phone build for a private draft. Android only: the desktop builds live
# in release.yml and desktop-windows.yml, and nothing here touches them — a
# draft is a sideloaded APK, signed with the fork's key so it installs over
# the last one without touching the prod app.
#
# Manual dispatch on purpose. A draft is not cut by a tag: the tag and the
# desktop release workflow are tied to published releases, and a private
# preview should not be able to start either by accident.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the APK, verbatim"
        required: true
        default: "3.0.29"
      version_code:
        description: "versionCode stamped into the APK"
        required: true
        default: "134"
      tag:
        description: "Tag of the private draft release"
        required: true
        default: "v3.0.29-draft"
      title:
        description: "Title of the private draft release"
        required: true
        default: "Auris 3.0.29 — private preview"
      notes:
        description: "Release notes for the draft"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-draft-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and draft
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      - name: Write local.properties
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
          } > local.properties

      # The fork's key, the same one every private draft since 2.3.x was
      # signed with — so a tester installs this over the last one without
      # uninstalling first, and without touching the prod package.
      - name: Fork signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > bitchord-fork.jks
          {
            echo "storeFile=bitchord-fork.jks"
            echo "storePassword=android"
            echo "keyAlias=forkdebug"
            echo "keyPassword=android"
          } > keystore.properties

      # The version is stamped from the input rather than read out of the
      # build file, so the number in the dispatch and the number inside the
      # APK cannot drift apart. The build file is the fallback; both are
      # checked before anything is compiled.
      - name: Stamp the version
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          vc="${{ inputs.version_code }}"
          sed -i -E "s/^(\s*)versionCode = [0-9]+/\1versionCode = $vc/" app/build.gradle.kts
          sed -i -E "s/^(\s*)versionName = \"[^\"]*\"/\1versionName = \"$v\"/" app/build.gradle.kts
          grep -E "versionCode = |versionName = " app/build.gradle.kts | head -4
          grep -q "versionCode = $vc" app/build.gradle.kts
          grep -q "versionName = \"$v\"" app/build.gradle.kts

      # The dev flavour, release build type: R8, no debuggable runtime, signed.
      # The ABI splits give one APK per architecture plus a universal one.
      - name: Build the APKs
        run: ./gradlew :app:assembleDevRelease

      - name: Collect
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/dev/release/*.apk dist/
          ls -lh dist

      # The analyser library's presence is the proof that this build carries
      # the neural path and is not an older APK wearing a newer version name.
      - name: The analyser is in the APK
        run: |
          set -euo pipefail
          for apk in dist/*.apk; do
            echo "== $apk"
            unzip -l "$apk" | grep -E "lib/.*/libbitchord_analysis.so" || {
              echo "no analyser library in $apk" >&2
              exit 1
            }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-draft-apk
          path: dist/*.apk

      # The package, the version and the signing certificate, checked before
      # anything is published: a tester installs this over the last draft, so
      # the package has to be the same one, the versionCode has to be higher
      # than the installed build's, and the certificate has to be the fork's.
      - name: Check the package, version and signature
        env:
          EXPECTED_FINGERPRINT: "385af3b4b3f5b4357b7bb271fd71b267fad4d536be87e44f2057b0c2de8971ce"
          EXPECTED_PACKAGE: "com.dev.bitchord"
        run: |
          set -euo pipefail
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in dist/*.apk; do
            echo "== $apk"
            badging="$("$bt/aapt2" dump badging "$apk" | grep -E "^package:" | head -1)"
            echo "$badging"
            echo "$badging" | grep -q "package: name='$EXPECTED_PACKAGE'"
            echo "$badging" | grep -q "versionCode='${{ inputs.version_code }}'"
            # The digest line is spelled differently by different build-tools
            # ("Signer #1 certificate SHA-256 digest:" on older ones, "V2
            # Signer: certificate SHA-256 digest:" on newer), so the hex is
            # taken out of whatever line names the SHA-256 rather than by
            # matching a label.
            certs="$("$bt/apksigner" verify --print-certs "$apk")"
            echo "$certs" | grep -i "sha-256" || true
            cert="$(echo "$certs" | grep -i "sha-256" | head -1 | tr -d ':' | grep -oiE "[0-9a-f]{64}" | head -1)"
            echo "signer: $cert"
            if [ -z "$cert" ]; then
              echo "no signer certificate found in $apk" >&2
              exit 1
            fi
            test "$cert" = "$EXPECTED_FINGERPRINT"
          done

      # The draft itself: private, untagged, no publish. GitHub creates the
      # tag only when a draft is published, so nothing is cut here — the
      # draft is a download, not a release.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
            fi
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,assets \
            --jq '{tag: .tagName, name: .name, draft: .isDraft, assets: [.assets[].name]}'
          # A published release would be public; a draft is not. Fail loudly
          # rather than let one slip out.
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
