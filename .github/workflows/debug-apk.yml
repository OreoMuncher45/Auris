name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build prod debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore stable debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.BITCHORD_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bitchord-debug.jks"

      - name: Build APK
        env:
          BITCHORD_DEBUG_STORE_FILE: ${{ runner.temp }}/bitchord-debug.jks
          BITCHORD_DEBUG_STORE_PASSWORD: ${{ secrets.BITCHORD_DEBUG_STORE_PASSWORD }}
          BITCHORD_DEBUG_KEY_ALIAS: ${{ secrets.BITCHORD_DEBUG_KEY_ALIAS }}
          BITCHORD_DEBUG_KEY_PASSWORD: ${{ secrets.BITCHORD_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleProdDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: bitchord-prod-debug
          path: app/build/outputs/apk/prod/debug/app-prod-debug.apk
          if-no-files-found: error
          retention-days: 14
